[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turnrag"
version = "0.1.0"
description = "CPU-only multi-turn RAG pipeline that rewrites follow-up questions, searches with BM25, learned sparse and dense retrieval, and decides each turn whether to answer, say it does not know, or ask a clarifying question."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adwitiya Shukla" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyStemmer>=2.2",
]

[project.optional-dependencies]
export = ["torch>=2.4", "transformers>=4.48", "safetensors>=0.4", "onnx>=1.16"]
eval = ["torch>=2.4", "transformers>=4.48", "bert-score>=0.3.13", "rouge-score>=0.1.2"]
dev = ["pytest>=8", "ruff>=0.6", "pytrec-eval-terrier>=0.5.6"]

[project.scripts]
turnrag = "turnrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turnrag = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
