<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turnrag chat</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f4; color: #1c1917; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  select, input, button { font: inherit; padding: 8px 10px; border: 1px solid #a8a29e; border-radius: 6px; }
  button { background: #1c1917; color: #fafaf9; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #log { display: flex; flex-direction: column; gap: 10px; min-height: 50vh; }
  .turn { padding: 10px 12px; border-radius: 8px; line-height: 1.45; white-space: pre-wrap; }
  .user { background: #e7e5e4; align-self: flex-end; max-width: 80%; }
  .agent { background: #ffffff; border: 1px solid #e7e5e4; }
  .meta { font-size: 12px; color: #57534e; margin-bottom: 6px; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #e7e5e4; margin-right: 6px; }
  .sources { font-size: 13px; margin-top: 8px; color: #44403c; }
  .sources a { color: #1d4ed8; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>turnrag chat</h1>
    <select id="collection"></select>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="message" autocomplete="off" placeholder="Ask a question, then ask a follow-up">
    <button id="send">Send</button>
  </form>
</main>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("message");
const send = document.getElementById("send");
const picker = document.getElementById("collection");
let session = null;
const labels = { answer: "answer", idk: "I don't know", clarify: "clarify" };

async function start() {
  const names = (await (await fetch("/collections")).json()).collections;
  for (const name of names) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    picker.appendChild(option);
  }
  session = (await (await fetch("/sessions", { method: "POST" })).json()).session_id;
}

picker.addEventListener("change", async () => {
  log.innerHTML = "";
  session = (await (await fetch("/sessions", { method: "POST" })).json()).session_id;
});

function bubble(kind, text) {
  const div = document.createElement("div");
  div.className = "turn " + kind;
  div.textContent = text;
  log.appendChild(div);
  return div;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || !session) return;
  input.value = "";
  send.disabled = true;
  bubble("user", text);
  const box = bubble("agent", "");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = "thinking";
  const body = document.createElement("div");
  box.appendChild(meta);
  box.appendChild(body);
  const response = await fetch("/sessions/" + session + "/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, collection: picker.value }),
  });
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let passages = [];
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      if (!part.startsWith("data: ")) continue;
      const item = JSON.parse(part.slice(6));
      if (item.type === "plan") {
        passages = item.passages;
        meta.innerHTML = "";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = labels[item.action] || item.action;
        meta.appendChild(tag);
        if (item.rewrite) meta.appendChild(document.createTextNode("searched for: " + item.rewrite));
      } else if (item.type === "token") {
        body.textContent += item.text;
      } else if (item.type === "done") {
        body.textContent = item.text;
        const tag = meta.querySelector(".tag");
        if (tag) tag.textContent = labels[item.action] || item.action;
        if (item.action === "answer" && passages.length) {
          const list = document.createElement("div");
          list.className = "sources";
          passages.forEach((p, i) => {
            const line = document.createElement("div");
            const name = p.title || p.document_id;
            if (p.url && p.url.startsWith("http")) {
              const link = document.createElement("a");
              link.href = p.url;
              link.target = "_blank";
              link.textContent = "[" + (i + 1) + "] " + name;
              line.appendChild(link);
            } else {
              line.textContent = "[" + (i + 1) + "] " + name;
            }
            list.appendChild(line);
          });
          box.appendChild(list);
        }
      }
    }
    log.scrollTop = log.scrollHeight;
  }
  send.disabled = false;
  input.focus();
});

start();
</script>
</body>
</html>
